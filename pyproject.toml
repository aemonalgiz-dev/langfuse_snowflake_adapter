[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langfuse-to-snowflake"
version = "0.1.0"
description = "Sync Langfuse tracing and review data into Snowflake, and keep it in step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "snowflake-connector-python>=3.12",
    "tenacity>=8.2",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
langfuse-to-snowflake = "langfuse_to_snowflake.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/langfuse_to_snowflake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: reads a real Langfuse project; needs credentials and network (run with -m live)",
]
# Live tests never run unless asked for.
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "."]

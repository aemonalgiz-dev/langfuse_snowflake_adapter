[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langfuse-to-snowflake"
version = "0.1.0"
description = "Sync Langfuse tracing and review data into Snowflake, and keep it in step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "snowflake-connector-python>=3.12",
    "snowflake-snowpark-python>=1.30",
    "tenacity>=8.2",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Snowpark's local emulator, which the tests run the Snowflake adapter on.
    "snowflake-snowpark-python[localtest]>=1.30",
    # Checks that the SQL the emulator cannot run at least parses.
    "sqlglot>=25",
]

[project.scripts]
langfuse-to-snowflake = "langfuse_to_snowflake.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/langfuse_to_snowflake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses the real Langfuse project or Snowflake account; needs credentials (run with -m live)",
]
filterwarnings = [
    # Raised inside Snowpark's emulator by the pandas it runs on; nothing of ours.
    "ignore::pandas.errors.ChainedAssignmentError",
    "ignore::FutureWarning:snowflake.snowpark",
    "ignore::DeprecationWarning:snowflake",
]
# Live tests never run unless asked for.
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "."]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Needs no credentials: Langfuse and Snowflake are faked.
      - name: Unit tests
        run: pytest

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t langfuse-to-snowflake:ci .
      - name: Refuses to start without an access key
        run: |
          set +e
          docker run --rm \
            -e LANGFUSE_PUBLIC_KEY=pk-ci -e LANGFUSE_SECRET_KEY=sk-ci \
            -e SNOWFLAKE_ACCOUNT=ci -e SNOWFLAKE_USER=ci -e SNOWFLAKE_PRIVATE_KEY_PATH=/none \
            -e SNOWFLAKE_WAREHOUSE=ci -e SNOWFLAKE_DATABASE=ci -e SNOWFLAKE_SCHEMA=ci \
            langfuse-to-snowflake:ci
          test $? -eq 2
      - name: Starts, serves the web app and reads keys from secret files
        run: |
          mkdir secrets
          printf 'pk-ci' > secrets/langfuse_public_key
          printf 'sk-ci' > secrets/langfuse_secret_key
          printf 'ci-access-key' > secrets/sync_api_key
          chmod -R a+rX secrets
          docker run -d --name app -p 8000:8000 -v "$PWD/secrets:/run/secrets:ro" \
            -e SNOWFLAKE_ACCOUNT=ci -e SNOWFLAKE_USER=ci -e SNOWFLAKE_PRIVATE_KEY_PATH=/none \
            -e SNOWFLAKE_WAREHOUSE=ci -e SNOWFLAKE_DATABASE=ci -e SNOWFLAKE_SCHEMA=ci \
            langfuse-to-snowflake:ci
          for attempt in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/ | grep --quiet "<title>Langfuse to Snowflake</title>"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/config)" = 401
          curl --silent --fail -H "X-API-Key: ci-access-key" http://127.0.0.1:8000/projects
      - name: Container logs
        if: always()
        run: docker logs app || true

name: Live tests

# Reads the real Langfuse test project to prove that the API still accepts what
# the client sends. Read-only. Needs these repository secrets:
#
#   LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
#   LANGFUSE_BASE_URL      e.g. https://us.cloud.langfuse.com
#
# Secrets are not available to pull requests from forks, so this never runs on those.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: Langfuse changes its API from time to time.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  langfuse:
    name: Langfuse API
    runs-on: ubuntu-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check that the secrets are set
        run: |
          if [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ]; then
            echo "::error::Set the LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY repository secrets."
            exit 1
          fi
      - name: Live tests
        run: pytest -m live -v

name: Live tests

# Reads the real Langfuse test project to prove that the API still accepts what
# the client sends. Read-only. Needs these repository secrets:
#
#   LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
#   LANGFUSE_BASE_URL      e.g. https://us.cloud.langfuse.com
#
# Until they are set the tests are skipped, with a warning on the run, rather
# than failed. Secrets are not available to pull requests from forks, so this
# never runs on those.
#
# The Snowflake adapter is tested on Snowpark's local emulator, in the CI workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: Langfuse changes its API from time to time.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  langfuse:
    name: Langfuse API
    runs-on: ubuntu-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - name: Check that the secrets are set
        id: secrets
        run: |
          if [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ]; then
            echo "::warning title=Live tests skipped::The LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY repository secrets are not set."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.set == 'true'
      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.set == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.secrets.outputs.set == 'true'
        run: pip install -e ".[dev]"
      - name: Live tests
        if: steps.secrets.outputs.set == 'true'
        run: pytest -m live tests/live -v
